<text x="374" y="164" fill="#edf0f5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0">ID</text>
<text x="422" y="164" fill="#edf0f5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0">EX</text>
<text x="470" y="164" fill="#edf0f5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0">MEM</text>
<text x="518" y="164" fill="#edf0f5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0">WB</text>
<g class="pulse" fill="#78d6c6">
<circle style="animation-delay:0.00s" cx="318" cy="188" r="3"/><circle style="animation-delay:0.20s" cx="366" cy="188" r="3"/><circle style="animation-delay:0.40s" cx="414" cy="188" r="3"/><circle style="animation-delay:0.60s" cx="462" cy="188" r="3"/><circle style="animation-delay:0.80s" cx="510" cy="188" r="3"/>
</g>
<path d="M326 205V222M422 205V222M518 205V222" stroke="#8f6d7c" class="flow"/>
<g fill="#151b25" stroke="#3a4351">
<rect x="299" y="228" width="77" height="27" rx="6"/><rect x="386" y="228" width="77" height="27" rx="6"/><rect x="473" y="228" width="77" height="27" rx="6"/>
</g>
<text x="337" y="246" fill="#cf9caf" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0">BRAM</text>
<text x="424" y="246" fill="#cf9caf" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0">I-CACHE</text>
<text x="511" y="246" fill="#cf9caf" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0">UART MMIO</text>
<text x="299" y="274" fill="#89919f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" font-weight="600" text-anchor="start" letter-spacing="0">32-BIT INSTRUCTION / DATA PATH</text>
</svg>
