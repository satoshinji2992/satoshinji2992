<text x="371" y="109" fill="#edf0f5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0">ID</text>
<text x="426" y="151" fill="#edf0f5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0">EX</text>
<text x="481" y="109" fill="#edf0f5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0">MEM</text>
<text x="536" y="151" fill="#edf0f5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0">WB</text>
<text x="339" y="246" fill="#cf9caf" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0">BRAM</text>
<text x="427" y="246" fill="#cf9caf" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0">I-CACHE</text>
<text x="515" y="246" fill="#cf9caf" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0">UART</text>
</svg>
