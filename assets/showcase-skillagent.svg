</g>
<g class="float">
<rect x="335" y="127" width="32" height="88" rx="8" fill="#151b25" stroke="#cf9caf"/>
<rect x="384" y="108" width="32" height="128" rx="8" fill="#151b25" stroke="#cf9caf"/>
<rect x="433" y="127" width="32" height="88" rx="8" fill="#151b25" stroke="#cf9caf"/>
</g>
<g fill="#cf9caf">
<rect class="shimmer" style="animation-delay:0.00s" x="393" y="126" width="7" height="7" rx="2"/><rect class="shimmer" style="animation-delay:0.15s" x="403" y="126" width="7" height="7" rx="2"/><rect class="shimmer" style="animation-delay:0.30s" x="393" y="143" width="7" height="7" rx="2"/><rect class="shimmer" style="animation-delay:0.45s" x="403" y="143" width="7" height="7" rx="2"/><rect class="shimmer" style="animation-delay:0.60s" x="393" y="160" width="7" height="7" rx="2"/><rect class="shimmer" style="animation-delay:0.75s" x="403" y="160" width="7" height="7" rx="2"/><rect class="shimmer" style="animation-delay:0.90s" x="393" y="177" width="7" height="7" rx="2"/><rect class="shimmer" style="animation-delay:1.05s" x="403" y="177" width="7" height="7" rx="2"/><rect class="shimmer" style="animation-delay:1.20s" x="393" y="194" width="7" height="7" rx="2"/><rect class="shimmer" style="animation-delay:1.35s" x="403" y="194" width="7" height="7" rx="2"/><rect class="shimmer" style="animation-delay:1.50s" x="393" y="211" width="7" height="7" rx="2"/><rect class="shimmer" style="animation-delay:1.65s" x="403" y="211" width="7" height="7" rx="2"/>
</g>
<text x="351" y="231" fill="#89919f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0">GRAPH</text>
<text x="400" y="252" fill="#89919f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0">LATENT</text>
<text x="449" y="231" fill="#89919f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0">ACTION</text>
<g class="signal">
<rect x="510" y="127" width="60" height="50" rx="8" fill="#151b25" stroke="#3a4351"/>
<text x="540" y="148" fill="#cf9caf" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0">SKILL</text>
<text x="540" y="163" fill="#edf0f5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" font-weight="650" text-anchor="middle" letter-spacing="0">PROGRAM</text>
</g>
<text x="302" y="282" fill="#89919f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="500" text-anchor="start" letter-spacing="0">STRUCTURE  →  LATENT  →  ACTION</text>
</svg>
