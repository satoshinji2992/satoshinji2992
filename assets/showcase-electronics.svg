<path d="M304 144H350M402 144H438M352 122H366M438 122H452"/>
<path d="M350 155H366M438 155H452" stroke-dasharray="3 4"/>
</g>
<g fill="#151b25" stroke="#3a4351">
<rect x="294" y="88" width="58" height="112" rx="9"/>
<rect x="366" y="81" width="72" height="126" rx="9"/>
<rect x="452" y="91" width="108" height="98" rx="9"/>
<path d="M300 102h-8M300 118h-8M300 134h-8M300 150h-8M300 166h-8M300 182h-8"/>
<path d="M432 96h9M432 112h9M432 128h9M432 144h9M432 160h9M432 176h9M432 192h9"/>
</g>
<g class="pulse" fill="#cf9caf">
<circle cx="323" cy="118" r="10"/><circle cx="323" cy="146" r="6"/><circle cx="323" cy="174" r="6"/>
</g>
<g class="shimmer" fill="#cf9caf">
<circle cx="392" cy="112" r="5"/><circle cx="412" cy="112" r="5"/>
<circle cx="392" cy="132" r="5"/><circle cx="412" cy="132" r="5"/>
<circle cx="392" cy="152" r="5"/><circle cx="412" cy="152" r="5"/>
<circle cx="392" cy="172" r="5"/><circle cx="412" cy="172" r="5"/>
</g>
<g class="float" fill="none" stroke="#cf9caf">
<circle cx="500" cy="140" r="25"/><path d="M500 140l18-12M500 140v18M500 140h-18"/>
<path d="M466 169h18l5-12 7 24 7-19 7 12h20" stroke-dasharray="4 3"/>
</g>
<text x="323" y="104" fill="#89919f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0">LENS</text>
<text x="402" y="101" fill="#cf9caf" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0">UART</text>
<text x="506" y="109" fill="#cf9caf" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0">PWM</text>
<text x="323" y="218" fill="#89919f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0">CAM</text>
<text x="402" y="231" fill="#89919f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0">MCU</text>
<text x="506" y="211" fill="#89919f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0">SERVO</text>
</svg>
