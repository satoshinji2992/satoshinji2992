<text x="970" y="100" fill="#89919f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" font-weight="600" text-anchor="start" letter-spacing="0.45">VISION · LANGUAGE · ACTION</text>
</g>
