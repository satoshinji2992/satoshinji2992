<text x="472" y="252" fill="#edf0f5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="650" text-anchor="start" letter-spacing="0">ROBOT LEARNING</text>
<text x="472" y="270" fill="#89919f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" font-weight="600" text-anchor="start" letter-spacing="0.45">POLICY · DATA · REAL WORLD</text>
</g>
