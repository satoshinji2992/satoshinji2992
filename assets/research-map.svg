<circle cx="790" cy="165" r="34" fill="#111722" stroke="#cf9caf" stroke-width="1.5"/>
<circle cx="790" cy="165" r="25" fill="none" stroke="#596273"/>
<text x="790" y="160" fill="#f3eef1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">AGENT</text>
<text x="790" y="180" fill="#89919f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0">CORE</text>
