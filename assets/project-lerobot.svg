<text x="34" y="123" fill="#f3eef1" font-family="Georgia,serif" font-size="46" font-weight="700" text-anchor="start" letter-spacing="0">LeRobot</text>
<text x="34" y="157" fill="#cf9caf" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" text-anchor="start" letter-spacing="0.5">VLA / UPSTREAM CONTRIBUTION</text>
<text x="34" y="190" fill="#a8afbb" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="500" text-anchor="start" letter-spacing="0">CAMERA + LANGUAGE  →  ACTION</text>
