<text x="34" y="223" fill="#cf9caf" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" text-anchor="start" letter-spacing="0.25">PURE C GAME CORE / PORTABLE VIEW</text>
