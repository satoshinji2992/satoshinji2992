<svg width="1127" height="290" viewBox="0 0 1127 290" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <!-- 纸面 brutalist 横幅：与 quickly_access_to_deeplearning 站点同款视觉 -->
