  <text x="74" y="200" font-size="20" font-weight="600" fill="#42505d">从 NumPy 到 Transformer —— 手写一切，再拆开看。</text>
  <text x="74" y="228" font-size="14" fill="#8a94a0">y = ax + b → MLP → ResNet → attention → RoPE · GQA · KV Cache</text>
