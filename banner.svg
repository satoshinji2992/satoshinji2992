    <line x1="820" y1="90" x2="880" y2="76"/><line x1="820" y1="90" x2="880" y2="122"/>
    <line x1="820" y1="140" x2="880" y2="76"/><line x1="820" y1="140" x2="880" y2="122"/><line x1="820" y1="140" x2="880" y2="168"/>
