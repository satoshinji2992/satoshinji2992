    <line x1="880" y1="76" x2="946" y2="98"/><line x1="880" y1="76" x2="946" y2="160"/>
    <line x1="880" y1="122" x2="946" y2="98"/><line x1="880" y1="122" x2="946" y2="160"/>
    <line x1="880" y1="168" x2="946" y2="98"/><line x1="880" y1="168" x2="946" y2="160"/>
